app-id: app.busnes.kyauth
runtime: org.kde.Platform
runtime-version: "6.11"
sdk: org.kde.Sdk
command: kyauth
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --share=network
  # UnifiedPush (src/app/unifiedpush.cpp): KyAuth registers with the distributor, which calls
  # back on app.busnes.kyauth. A Flatpak may always own its own app ID, so no --own-name.
  - --talk-name=org.unifiedpush.Distributor.*
  # Controller::notifyDesktop posts a fixed "Sign-in request" notification.
  - --talk-name=org.freedesktop.Notifications
modules:
  # The SDK has QtDBus but no daemon; keep the real private-bus test in run-tests.
  # Remove these build-only tools and libraries before producing the app.
  - name: dbus-test-tools
    buildsystem: meson
    config-opts:
      # Static: dbus-daemon needs libdbus-1 private symbols, versioned per release
      # (LIBDBUS_PRIVATE_1.16.2). Meson drops its build-tree rpath on install, so a
      # shared build resolves whichever libdbus the runtime ships and dies on any
      # runtime whose dbus differs from the pin. Linking it in removes the coupling.
      - -Ddefault_library=static
      - -Dasserts=true
      - -Dsystemd=disabled
      - -Duser_session=false
      - -Dselinux=disabled
      - -Dapparmor=disabled
      - -Dx11_autolaunch=disabled
      - -Dmodular_tests=disabled
      - -Dxml_docs=disabled
      - -Ddoxygen_docs=disabled
      - -Dducktype_docs=disabled
      - -Dqt_help=disabled
    cleanup: ['*']
    sources:
      - type: archive
        url: https://dbus.freedesktop.org/releases/dbus/dbus-1.16.2.tar.xz
        sha256: 0ba2a1a4b16afe7bceb2c07e9ce99a8c2c3508e5dec290dbb643384bd6beb7e2
  - name: kyauth
    buildsystem: cmake-ninja
    # The ctest suite, QML smoke test included, runs inside the build.
    run-tests: true
    build-options:
      env:
        CTEST_OUTPUT_ON_FAILURE: '1'
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: dir
        path: ../..
        skip: [build, .claude, .clickable, .flatpak-builder, build-flatpak]
