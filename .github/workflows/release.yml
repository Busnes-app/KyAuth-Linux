# Installables for a tagged release. See docs/DISTRIBUTION.md.
#
# - Ubuntu Touch: the arm64 click, attached to the GitHub release.
# - Nura: a signed Flatpak repository on gh-pages, so `flatpak update` works, plus signed
#   bundles on the release that update from it.
#
# Pull requests build and smoke-test the Flatpak for both architectures; only tags publish.
# The signing key reaches the publish job alone, never a build job.

name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Publishing runs must never race the gh-pages force-push, nor be cancelled halfway.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('release-pr-{0}', github.ref) || 'release-publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: read-all

env:
  APP_ID: app.busnes.kyauth
  MANIFEST: packaging/flatpak/app.busnes.kyauth.yaml
  # Baked into every client's remote; Pages does not follow a repository transfer.
  PAGES_URL: https://busnes-app.github.io/KyAuth-Linux

jobs:
  version:
    name: Version matches tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Flatpak repository is append-only: a wrong version cannot be unpublished.
      - run: ./scripts/verify-version.sh "$GITHUB_REF_NAME"

  click:
    name: Ubuntu Touch click (arm64)
    if: github.event_name != 'pull_request' # ci.yml builds it on pull requests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Clickable
        run: pip install --user --require-hashes -r .github/requirements/clickable.txt
      - name: Build click
        # Clickable prefers podman, whose rootless mode cannot map the image's IDs on the runner.
        env:
          CLICKABLE_DOCKER_COMMAND: docker
        run: ~/.local/bin/clickable build --arch arm64 --accept-review-errors
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: click-${{ github.sha }}
          path: build/aarch64-linux-gnu/app/*.click
          if-no-files-found: error

  flatpak:
    name: Flatpak (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs_on: ubuntu-24.04
          - arch: aarch64
            runs_on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          # elfutils: flatpak-builder strips binaries with eu-strip.
          sudo apt-get install -y --no-install-recommends \
            flatpak flatpak-builder ostree appstream desktop-file-utils elfutils
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Validate metadata
        run: |
          appstreamcli validate --no-net packaging/nura/app.busnes.kyauth.metainfo.xml
          desktop-file-validate packaging/nura/app.busnes.kyauth.desktop

      # Flathub's CDN drops pulls now and then; flatpak install resumes, so retry it.
      - name: Install runtime and SDK
        run: |
          set -eu
          for ref in org.kde.Platform//6.11 org.kde.Sdk//6.11; do
            for attempt in 1 2 3 4; do
              flatpak install --user -y --noninteractive flathub "$ref" && continue 2
              echo "::warning::Pulling $ref failed (attempt $attempt of 4)"
              sleep $(( attempt * 20 ))
            done
            echo "::error::Could not pull $ref from Flathub" >&2
            exit 1
          done

      # Runs the ctest suite inside the build (run-tests in the manifest).
      - name: Build and export
        run: flatpak-builder --user --force-clean --repo="repo-${{ matrix.arch }}" build-flatpak "$MANIFEST"

      # The app's own smoke test, inside the sandbox: loads the QML, adds an account, visits
      # every page and locks; any Qt warning fails it. No session bus, so Qt's portal lookups
      # cannot add warnings of their own.
      - name: Smoke test
        run: |
          env -u DBUS_SESSION_BUS_ADDRESS timeout 60 flatpak-builder --run build-flatpak "$MANIFEST" \
            env QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software kyauth --smoke-test

      - name: Build unsigned bundle
        run: |
          flatpak build-bundle --arch="${{ matrix.arch }}" "repo-${{ matrix.arch }}" \
            "kyauth-${{ matrix.arch }}.flatpak" "$APP_ID" \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak-bundle-${{ matrix.arch }}-${{ github.sha }}
          path: kyauth-${{ matrix.arch }}.flatpak
          if-no-files-found: error

      # tar, uncompressed: OSTree objects are already compressed, and tar keeps the layout.
      - name: Pack OSTree repo
        run: tar -cf "repo-${{ matrix.arch }}.tar" "repo-${{ matrix.arch }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repo-${{ matrix.arch }}-${{ github.sha }}
          path: repo-${{ matrix.arch }}.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish release
    needs: [version, click, flatpak]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write # push gh-pages; create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require the signing key
        env:
          HAS_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY != '' && secrets.FLATPAK_GPG_KEY_ID != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::FLATPAK_GPG_PRIVATE_KEY and FLATPAK_GPG_KEY_ID are not set. See docs/DISTRIBUTION.md." >&2
            exit 1
          fi

      - name: Install Flatpak and OSTree
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak ostree

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: repo-*-${{ github.sha }}
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: click-${{ github.sha }}

      - name: Unpack OSTree repos
        run: |
          for arch in x86_64 aarch64; do tar -xf "repo-$arch.tar"; done

      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --homedir "$GNUPGHOME" --batch --import
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      # The repo must accumulate: `flatpak update` needs the commit a user already has.
      # git drops OSTree's empty directories, and the next publish fails without them.
      - name: Restore the published repo
        env:
          TOKEN: ${{ github.token }}
        run: |
          if git clone --depth 1 --branch gh-pages \
              "https://x-access-token:$TOKEN@github.com/${{ github.repository }}.git" _site; then
            rm -rf _site/.git
            mkdir -p _site/repo/tmp/cache _site/repo/state _site/repo/extensions \
                     _site/repo/refs/heads _site/repo/refs/mirrors _site/repo/refs/remotes
          else
            mkdir -p _site/repo
          fi

      # build-commit-from signs each commit, which is what a client verifies; pull-local would
      # copy them unsigned. Debug refs stay out to keep the site small.
      - name: Merge, sign and update the repo
        env:
          GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
        run: |
          set -eu
          ostree --repo=_site/repo init --mode=archive-z2
          for arch in x86_64 aarch64; do
            for ref in $(ostree --repo="repo-$arch" refs); do
              case "$ref" in *.Debug/*) continue ;; esac
              flatpak build-commit-from --src-repo="repo-$arch" --no-update-summary \
                --gpg-sign="$GPG_KEY_ID" --gpg-homedir="$GNUPGHOME" _site/repo "$ref"
            done
          done
          flatpak build-update-repo --title=KyAuth --generate-static-deltas --prune --prune-depth=3 \
            --gpg-sign="$GPG_KEY_ID" --gpg-homedir="$GNUPGHOME" _site/repo

      - name: Write the .flatpakrepo, landing page and signed bundles
        env:
          GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
        run: |
          set -eu
          gpg --homedir "$GNUPGHOME" --export "$GPG_KEY_ID" > _site/kyauth.gpg
          {
            echo "[Flatpak Repo]"
            echo "Title=KyAuth"
            echo "Url=$PAGES_URL/repo/"
            echo "Homepage=https://github.com/${{ github.repository }}"
            echo "Comment=Authenticator codes and KyIdentity sign-in approvals"
            echo "GPGKey=$(base64 -w0 < _site/kyauth.gpg)"
          } > _site/kyauth.flatpakrepo
          sed "s|@PAGES_URL@|$PAGES_URL|g; s|@REPOSITORY@|${{ github.repository }}|g" \
            packaging/flatpak/site/index.html.in > _site/index.html
          touch _site/.nojekyll # serve the OSTree repo byte for byte
          # --repo-url and --gpg-keys make a bundle install updatable from the signed repo.
          for arch in x86_64 aarch64; do
            flatpak build-bundle --arch="$arch" _site/repo "kyauth-$arch.flatpak" "$APP_ID" \
              --repo-url="$PAGES_URL/repo/" --gpg-keys=_site/kyauth.gpg \
              --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
              --gpg-sign="$GPG_KEY_ID" --gpg-homedir="$GNUPGHOME"
          done

      - name: Destroy signing key
        if: always()
        run: rm -rf "$RUNNER_TEMP/gnupg"

      - name: Publish to gh-pages
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -eu
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Publish $GITHUB_REF_NAME"
          git push -f "https://x-access-token:$TOKEN@github.com/${{ github.repository }}.git" gh-pages
          du -sh . | awk '{print "Published site: " $1 " (GitHub Pages caps sites at 1 GB)"}'

      - name: Attach installables to the release
        # Pinned to a commit: a repointed tag would run with this job's write token.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            *.click
            kyauth-*.flatpak
            _site/kyauth.flatpakrepo
          fail_on_unmatched_files: true
          generate_release_notes: true
