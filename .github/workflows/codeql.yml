name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

# Supersede a pull request's older run; every other run gets its own group so none is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # C++ needs a real build so CodeQL sees the compiler calls, moc output included.
          # Qt 6 only: the Qt 5 build compiles the same sources.
          - language: c-cpp
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.build-mode == 'manual'
        name: Install dependencies
        # The qt6 package list from ci.yml's test job.
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          cmake ninja-build g++ libssl-dev dbus-daemon
          qt6-base-dev qt6-declarative-dev qml6-module-qtquick qml6-module-qtquick-controls
          qml6-module-qtquick-layouts qml6-module-qtquick-templates qml6-module-qtquick-window
          qml6-module-qtqml-workerscript qml6-module-qtqml-models libgl-dev
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          build-mode: ${{ matrix.build-mode }}
      - if: matrix.build-mode == 'manual'
        name: Build
        # Build outside the checkout so moc output falls outside the source root and is not analysed.
        run: |
          cmake -B "$RUNNER_TEMP/build" -S . -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build "$RUNNER_TEMP/build"
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
