name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions: read-all

# Supersede a pull request's older run; every other run gets its own group so none is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.qt }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Qt 5.15 is what Ubuntu Touch ships; Qt 6 is what Nura's Plasma Mobile ships.
          - qt: qt5
            packages: >-
              qtbase5-dev qtdeclarative5-dev qtquickcontrols2-5-dev qml-module-qtquick2
              qml-module-qtquick-controls2 qml-module-qtquick-layouts qml-module-qtquick-window2
              qml-module-qtquick-templates2 qml-module-qtqml-models2
          - qt: qt6
            packages: >-
              qt6-base-dev qt6-declarative-dev qml6-module-qtquick qml6-module-qtquick-controls
              qml6-module-qtquick-layouts qml6-module-qtquick-templates qml6-module-qtquick-window
              qml6-module-qtqml-workerscript qml6-module-qtqml-models libgl-dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build g++ libssl-dev dbus-daemon ${{ matrix.packages }}
      - name: Build
        run: |
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  click:
    name: Ubuntu Touch click (arm64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Clickable
        run: pip install --user --require-hashes -r .github/requirements/clickable.txt
      - name: Build click
        # Clickable prefers podman, whose rootless mode cannot map the image's IDs on the runner.
        env:
          CLICKABLE_DOCKER_COMMAND: docker
        run: ~/.local/bin/clickable build --arch arm64 --accept-review-errors

  # libFuzzer (ASan+UBSan) over the text a QR scan or paste hands the app: otpauth:// links
  # and KyIdentity pairing codes (fuzz/). Replays the seed corpus, then fuzzes for a minute.
  fuzz:
    name: Fuzz scanned codes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Configure resolves the app's Qt modules even though the fuzzer links QtCore only.
      - name: Install dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build
          clang libclang-rt-dev libssl-dev qt6-base-dev qt6-declarative-dev libgl-dev
      - name: Build fuzzer
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -B build-fuzz -S . -G Ninja -DCMAKE_BUILD_TYPE=Debug -DKYAUTH_TESTS=OFF -DKYAUTH_FUZZ=ON
          cmake --build build-fuzz --target scan_fuzzer
      - name: Replay seed corpus
        run: build-fuzz/fuzz/scan_fuzzer fuzz/corpus/scan/*
      - name: Fuzz for 60 seconds
        run: |
          mkdir -p "$RUNNER_TEMP/corpus" "$RUNNER_TEMP/crashes"
          cp fuzz/corpus/scan/* "$RUNNER_TEMP/corpus/"
          build-fuzz/fuzz/scan_fuzzer -max_total_time=60 -timeout=25 -dict=fuzz/scan.dict \
            -artifact_prefix="$RUNNER_TEMP/crashes/" "$RUNNER_TEMP/corpus"
      - name: Keep crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes-${{ github.sha }}
          path: ${{ runner.temp }}/crashes/
          if-no-files-found: ignore
